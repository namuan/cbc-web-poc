services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  setup:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "db:setup", "--workspace", "@cbc/api"]
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/app
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_PORT: "3001"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/app
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["sh", "-c", "npm run db:setup --workspace @cbc/api && npm test --workspace @cbc/api"]
    environment:
      DATABASE_URL: postgres://app:integration-test-only@test-db:5432/app_test
      TEST_DATABASE_URL: postgres://app:integration-test-only@test-db:5432/app_test
      NODE_ENV: development
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"

  test-db:
    profiles: ["test"]
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: integration-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
